[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-course"
version = "0.1.0"
description = "Agentic AI: From Zero to Production - a 10-stage hands-on course that also deploys"
requires-python = ">=3.11"
license = { text = "MIT" }

# Core stays deliberately tiny: everything stage 1 needs and nothing more.
# Heavier stages opt in through the extras below (ADR-0001).
#
# numpy is core and not a stage extra, because shared/embeddings.py imports it
# unconditionally and shared/check.py exercises it. A package the shared layer
# imports at module level is a core dependency whatever the extras table says -
# CI proved it by dying on import before the first check ran (ADR-0007).
dependencies = [
    "numpy>=1.26",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# --- per-stage extras -------------------------------------------------------
# Versions carry floors, not exact pins. Each stage pins what it actually
# installs and verifies, at the moment it is built - a fake pin on an untested
# package is worse than an honest floor.
s03 = ["langgraph>=0.2", "langchain-openai>=0.2"]
# Мінорний пін, а не підлога — виняток із правила вище й єдиний у файлі. Установка за
# `>=1.2` дала 2.0.0, у якій зникла точка входу й перейменовано всі поля відповіді
# (ADR етапу 4 0005).
s04 = ["mcp>=2.0,<3"]
s06 = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Мінорний пін, другий у файлі й з тієї самої причини, що s04. APScheduler 4.x —
    # переписаний з нуля: інший API планувальника, інша модель сховища задач. Підлога
    # `>=3.10` віддала б 4.x тому, хто встановить етап через рік, і зламала б рівно
    # ту вправу, заради якої етап існує.
    "apscheduler>=3.10,<4",
    "prometheus-client>=0.20",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
]
# Веб-частина живого режиму етапу 7. Окремо від `voice`, бо це різні речі: тут сервер
# і сокет, там — ваги моделей на гігабайти. Сторінка з числами працює й без моделей,
# тож розділення дає читачеві дешевший вхід.
s07 = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
# CrewAI має маркер, і це найкорисніша знахідка етапу 9. Жодна версія ВІД 0.14.0 не оголошує
# підтримки Python 3.14: усі вимагають `<3.14` або `<=3.13`. Нижчі ставляться (0.11.2 каже
# `>=3.10,<4.0`), але не мають `BaseLLM` — точки, крізь яку етап подає власного клієнта,
# тож для нього не рахуються. Без маркера
# `pip install -e ".[s09]"` на 3.14 падає цілком — і забирає з собою LangGraph, який
# установився б чудово. Тобто інструкція карала б за послух: читач, який виконав
# написане, лишався б без нічого, а той, хто не виконав, — з робочим етапом (PLAYBOOK §5).
#
# Обмеження інтерпретатора — теж обмеження, і саме воно вирішує вибір першим, ще до
# питання про елегантність. Етап показує це рядком таблиці, а не приміткою.
# Верхні межі, а не самі підлоги — третій випадок у файлі, після s04 і s06. Причина та
# сама, і етап 9 її ще й вимірює: підлога `>=0.2` віддасть тому, хто встановить етап через
# рік, зовсім інший пакет, а смоук цього етапу ловить розрив API вже ПІСЛЯ оновлення.
# Без верхньої межі NFR-8 лишався б вимогою, яку сам маніфест не виконує — а `DECISION.md`
# учить читача саме цієї вади.
#
# `langchain-openai` тут немає навмисно: жоден модуль етапу його не імпортує, а
# `langchain-core`, чиї рядки трасуються, приходить транзитивно з LangGraph.
s09 = [
    "langgraph>=0.2,<2",
    "crewai>=0.60,<2; python_version < '3.14'",
]

# --- capability extras ------------------------------------------------------
embed = ["fastembed>=0.4"]
voice = ["faster-whisper>=1.0", "piper-tts>=1.2"]
adk = ["google-adk>=1.0"]
prod = ["agentic-ai-course[s03,s04,s06,embed]", "langfuse>=2.50"]
# psycopg тут, а не лише в [s06]: scripts/migrate.py — інфраструктура репозиторію,
# і скелетний смоук-тест має вміти прогнати міграції ще до етапу 6.
# pyyaml — перевірка розбирає docker-compose.prod.yml структурою, а не пошуком підрядків:
# інакше перенесення залежності між сервісами дає поломку й лишає перевірку зеленою.
dev = ["ruff>=0.6", "psycopg[binary]>=3.2", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
include = ["shared*", "stages*", "scripts*"]
exclude = ["docs*", "planning*", "deploy*", "migrations*"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Уроки повні ілюстративних ФРАГМЕНТІВ коду. Ruff форматує python-блоки всередині
# markdown, і на фрагменті це змінює зміст: `description="x",` (іменований аргумент)
# він переписує на `description = ("x",)` (присвоєння кортежу), бо ізольовано це
# справді валідний Python. Фрагмент у прозі — не код на компіляцію.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Lesson code is read as much as it is run: a stage may keep an unused import
# next to the line that explains it.
"stages/*/solutions/*" = ["F401"]
