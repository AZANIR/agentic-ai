name: ci

# Головна властивість цього пайплайну: у ньому НЕМАЄ жодного секрета.
# Усі перевірки працюють на детермінованому FakeLLM (ADR-0006), тож CI не залежить
# ні від доступності LLM-провайдера, ні від лімітів безкоштовного тарифу, ні від
# того, чи є в форку доступ до секретів репозиторію.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Нижня заявлена межа і свіжий пітон. Середні версії нічого не додають:
        # ламається зазвичай або те, що прибрали після 3.11, або те, що змінили
        # в найновішому.
        python-version: ["3.11", "3.13"]

    steps:
      # fetch-depth: 0 — перевірки «нижній етап не змінено» звіряються з теґом
      # попереднього етапу, а неглибокий клон теґів не тягне (ADR-0007).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # build_cmd з docs/architecture-map.md
      - name: Install
        run: pip install -e ".[dev]"

      # lint_cmd з docs/architecture-map.md
      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # test_cmd з docs/architecture-map.md — офлайн, без ключів
      - name: Checks
        env:
          DATABASE_URL: postgresql://agentic:agentic@127.0.0.1:5432/agentic
          REDIS_URL: redis://127.0.0.1:6379/0
        run: python scripts/check_all.py

  # Друга робота існує через одну властивість: етапи мають проходитись БЕЗ необовʼязкових
  # бібліотек, тому основна робота ставить лише [dev]. Наслідок — перевірки, які без них
  # позначаються «НЕ ПЕРЕВІРЕНО», у CI не виконувались би ніде й ніколи, а пайплайн лишався
  # б зеленим. Тут вони виконуються.
  optional-extras:
    runs-on: ubuntu-latest

    # Сервіси, а не пакети. Етап 6 має перевірки, яким потрібні саме вони: контракт
    # сховища на базі, спільний лічильник, дві умови міграції. Без них вони чесно кажуть
    # `НЕ ПЕРЕВІРЕНО` — але ця робота існує рівно для того, щоб неперевіреного тут не
    # лишилось, тож сервіси мають бути підняті.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentic
          POSTGRES_PASSWORD: agentic
          POSTGRES_DB: agentic
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agentic -d agentic"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20

    steps:
      # fetch-depth: 0 — перевірки «нижній етап не змінено» звіряються з теґом
      # попереднього етапу, а неглибокий клон теґів не тягне (ADR-0007).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install with per-stage extras
        run: pip install -e ".[dev,s03,s04,s06,s07]"

      - name: Migrate
        env:
          DATABASE_URL: postgresql://agentic:agentic@127.0.0.1:5432/agentic
        run: python scripts/migrate.py up

      # Той самий набір, але тепер порівняння двох реалізацій графа справді відбувається.
      #
      # `--strict-unverified` compares the third states of this run against the register
      # in scripts/check_all.py. A blunt grep for the marker cannot work here: two of
      # stage 10's checks stay third-state for ever - a run against a real HTTPS domain
      # needs a live machine, not a package - so the gate would be unsatisfiable and was.
      # The register names what may stay silent and why; anything else, in either
      # direction, fails the build. See docs/adr/0009.
      - name: Checks, and nothing unverified beyond the register
        run: python scripts/check_all.py --strict-unverified
